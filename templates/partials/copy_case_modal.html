<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-lg p-6 relative">
        <!-- Tombol Tutup -->
        <button type="button" 
                onclick="document.getElementById('modal-container').innerHTML = ''" 
                class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 transition-colors">
            ✕
        </button>

        <div class="mb-5">
            <h2 class="text-lg font-bold text-slate-900">📄 Duplikat Skenario Tes</h2>
            <p class="text-sm text-slate-500 mt-1">
                Salin seluruh metadata dan alur langkah dari skenario <span class="font-semibold text-slate-700">"{{ case.name }}"</span> menjadi skenario baru.
            </p>
        </div>

        <form hx-post="/testcase/{{ case.id }}/copy" class="space-y-4">
            <!-- Nama Skenario Baru -->
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Nama Skenario Baru <span class="text-red-500">*</span></label>
                <input type="text" 
                       name="new_name" 
                       value="{{ suggested_name }}" 
                       required 
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-medium focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all">
            </div>

            <!-- Pilih Target Proyek -->
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Target Proyek</label>
                <select name="target_project_id" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-medium bg-white focus:outline-none focus:border-blue-500">
                    {% for proj in projects %}
                        <option value="{{ proj.id }}" {% if proj.id == case.project_id %}selected{% endif %}>
                            📁 {{ proj.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="pt-3 flex justify-end gap-3">
                <button type="button" 
                        onclick="document.getElementById('modal-container').innerHTML = ''" 
                        class="px-5 py-2.5 rounded-xl font-bold text-sm text-slate-600 hover:bg-slate-100 transition-colors">
                    Batal
                </button>
                <button type="submit" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-xl transition-all shadow-md flex items-center gap-2 cursor-pointer">
                    <span>📄</span> Proses Duplikat
                </button>
            </div>
        </form>
    </div>
</div>
