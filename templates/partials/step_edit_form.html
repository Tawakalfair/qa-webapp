<tr id="step-row-{{ step.id }}" class="bg-blue-50/60">
    <td class="px-3 py-3 text-center text-xs font-bold text-blue-600 align-middle">
        {{ step.step_order }}
    </td>
    <td colspan="4" class="px-3 py-2">
        <form hx-post="/testcase/{{ case_id }}/step/{{ step.id }}/edit"
              hx-target="#step-list-container"
              hx-swap="outerHTML"
              class="flex items-center gap-2 w-full">
            
            <!-- Select Command -->
            <select name="command" required onchange="toggleStepInputs(this)" class="px-2 py-1.5 border border-slate-300 rounded-lg text-xs font-mono font-semibold bg-white focus:outline-none focus:border-blue-500">
                {% for cmd in commands %}
                <option value="{{ cmd.code }}" {% if cmd.code == step.command %}selected{% endif %}>
                    {{ cmd.code }}
                </option>
                {% endfor %}
            </select>

            <!-- Target Selector -->
            <input type="text" name="target_selector" value="{{ step.target_selector or '' }}" placeholder="Target Selector"
                   {% if step.command == 'INCLUDE_SCENARIO' %}disabled placeholder="Tidak diperlukan (-)" class="px-2 py-1.5 border border-slate-300 rounded-lg text-xs font-mono flex-1 bg-slate-100 cursor-not-allowed"{% else %}class="px-2 py-1.5 border border-slate-300 rounded-lg text-xs font-mono flex-1 bg-white focus:outline-none focus:border-blue-500"{% endif %}>

            <!-- Input Value (Text Input) -->
            <input type="text" name="{% if step.command == 'INCLUDE_SCENARIO' %}input_value_text{% else %}input_value{% endif %}" value="{{ step.input_value or '' }}" placeholder="Input Value"
                   class="{% if step.command == 'INCLUDE_SCENARIO' %}hidden {% endif %}px-2 py-1.5 border border-slate-300 rounded-lg text-xs font-mono flex-1 bg-white focus:outline-none focus:border-blue-500 step-input-text"
                   {% if step.command == 'INCLUDE_SCENARIO' %}disabled{% endif %}>

            <!-- Input Value (Dropdown Skenario Target) -->
            <select name="{% if step.command == 'INCLUDE_SCENARIO' %}input_value{% else %}input_value_select{% endif %}"
                    class="{% if step.command != 'INCLUDE_SCENARIO' %}hidden {% endif %}px-2 py-1.5 border border-slate-300 rounded-lg text-xs font-semibold flex-1 bg-white focus:outline-none focus:border-blue-500 step-input-select"
                    {% if step.command != 'INCLUDE_SCENARIO' %}disabled{% endif %}>
                <option value="">-- Pilih Skenario Target --</option>
                {% for other in other_cases %}
                <option value="{{ other.id }}" {% if step.command == 'INCLUDE_SCENARIO' and (other.id|string == step.input_value) %}selected{% endif %}>
                    📁 [{{ other.project.name if other.project else 'Default' }}] {{ other.name }}
                </option>
                {% endfor %}
            </select>

            <!-- Tombol Aksi -->
            <div class="flex items-center gap-1">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow-sm transition-colors cursor-pointer">
                    Simpan
                </button>
                <button type="button" 
                        hx-get="/testcase/{{ case_id }}" 
                        hx-target="#right-panel" 
                        hx-swap="innerHTML"
                        class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-1.5 rounded-lg text-xs transition-colors cursor-pointer">
                    Batal
                </button>
            </div>
        </form>
    </td>
</tr>
