<div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-lg w-full p-6 space-y-5 animate-in fade-in zoom-in duration-150">
        <div class="flex justify-between items-center border-b pb-3">
            <h3 class="font-bold text-lg text-slate-900">✏️ Edit Perintah: <span class="font-mono text-blue-600">{{ cmd.code }}</span></h3>
            <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
        </div>

        <form hx-post="/commands/{{ cmd.id }}/edit" 
              hx-target="#command-table-container"
              hx-on::after-request="document.getElementById('modal-container').innerHTML=''"
              class="space-y-4">
              
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Kode Perintah</label>
                <input type="text" name="code" value="{{ cmd.code }}" required 
                       class="w-full px-4 py-2 rounded-xl border font-mono uppercase text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Label UI</label>
                <input type="text" name="label" value="{{ cmd.label }}" required 
                       class="w-full px-4 py-2 rounded-xl border text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Deskripsi</label>
                <textarea name="description" rows="2" class="w-full px-4 py-2 rounded-xl border text-sm">{{ cmd.description or '' }}</textarea>
            </div>

            <div class="p-3 bg-slate-50 rounded-xl border space-y-2">
                <label class="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                    <input type="checkbox" name="requires_selector" value="true" {% if cmd.requires_selector %}checked{% endif %} class="rounded text-blue-600">
                    Butuh Target Selector
                </label>
                <label class="flex items-center gap-2 text-xs font-semibold cursor-pointer">
                    <input type="checkbox" name="requires_value" value="true" {% if cmd.requires_value %}checked{% endif %} class="rounded text-blue-600">
                    Butuh Nilai Input / Value
                </label>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Placeholder Selector</label>
                    <input type="text" name="placeholder_selector" value="{{ cmd.placeholder_selector or '' }}" class="w-full px-3 py-1.5 rounded-lg border text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Placeholder Value</label>
                    <input type="text" name="placeholder_value" value="{{ cmd.placeholder_value or '' }}" class="w-full px-3 py-1.5 rounded-lg border text-xs">
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-3 border-t">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-4 py-2 rounded-xl border text-sm font-semibold text-slate-600 hover:bg-slate-100">
                    Batal
                </button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold shadow-sm">
                    Simpan Perubahan
                </button>
            </div>
        </form>
    </div>
</div>
