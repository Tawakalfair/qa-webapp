<div class="space-y-8">
    
    <!-- Detail & Tombol Run -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border">
        <div class="flex justify-between items-center mb-6">
            <div>
                <span class="bg-blue-50 text-blue-700 text-xs font-bold px-2 py-1 rounded-full">SKENARIO: {{ case.id }}</span>
                <h2 class="text-2xl font-extrabold mt-1">{{ case.name }}</h2>
                <p class="text-xs text-slate-400 font-mono mt-0.5">{{ case.base_url }}</p>
            </div>
            
            <button hx-post="/testcase/{{ case.id }}/run" 
                    hx-target="#run-status-container"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-md shadow-blue-100">
                ▶ Jalankan Tes
            </button>
        </div>

        <div id="run-status-container"></div>
    </div>

    <!-- Form Tambah Langkah (Menu Perintah Dibaca dari Database) -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border">
        <h3 class="font-bold text-slate-900 mb-4">＋ Tambah Langkah Instruksi</h3>
        
        <form hx-post="/testcase/{{ case.id }}/step" 
              hx-target="#steps-list-container" 
              hx-on::after-request="this.reset()"
              class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
            
            <!-- Dropdown Perintah Dinamis dari DB -->
            <div class="md:col-span-4">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Perintah Playwright</label>
                <select name="command" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                    {% for cmd in commands %}
                        <option value="{{ cmd.code }}">{{ cmd.code }} - {{ cmd.label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="md:col-span-3">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Target Selector</label>
                <input type="text" name="target_selector" placeholder="Misal: #btn-submit" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
            </div>

            <div class="md:col-span-3">
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Nilai Input / Value</label>
                <input type="text" name="input_value" placeholder="Misal: admin123" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
            </div>

            <div class="md:col-span-2">
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2 rounded-xl text-sm transition-all shadow-sm">
                    Tambah
                </button>
            </div>
        </form>
    </div>

    <!-- Tabel Daftar Langkah -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border">
        <h3 class="font-bold text-slate-900 mb-4">Alur Pengujian Skenario</h3>
        <div id="steps-list-container">
            {% include 'partials/step_list.html' %}
        </div>
    </div>
</div>
