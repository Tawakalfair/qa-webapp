<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-slate-200 pb-6 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">QA Automata</h1>
                <p class="text-slate-500 mt-1">Platform Visual Regression & Web Automation berbasis Playwright & HTMX</p>
            </div>

            <nav class="flex items-center gap-2 bg-slate-200/70 p-1.5 rounded-xl border border-slate-200">
                <a href="/" class="px-4 py-2 rounded-lg font-semibold text-sm text-slate-600 hover:text-slate-900 transition-colors">
                    📋 Skenario Tes
                </a>
                <a href="/commands" class="px-4 py-2 rounded-lg font-bold text-sm bg-white text-blue-600 shadow-sm">
                    ⚙️ Katalog Perintah
                </a>
            </nav>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 sticky top-8">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <span class="p-1 bg-blue-100 text-blue-600 rounded-lg text-xs">＋</span>
                        Tambah Perintah Master
                    </h2>
                    
                    <form hx-post="/commands/new" 
                          hx-target="#command-table-container" 
                          hx-on::after-request="this.reset()"
                          class="space-y-4">
                          
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Kode Perintah (Unique Code)</label>
                            <input type="text" name="code" required placeholder="Misal: SCROLL_DOWN" 
                                   class="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm font-mono uppercase focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Label UI</label>
                            <input type="text" name="label" required placeholder="Misal: Scroll Halaman ke Bawah" 
                                   class="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Deskripsi Ringkas</label>
                            <textarea name="description" rows="2" placeholder="Menjelaskan fungsi perintah..." 
                                      class="w-full px-4 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500"></textarea>
                        </div>

                        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200/80 space-y-2">
                            <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                                <input type="checkbox" name="requires_selector" value="true" class="rounded text-blue-600 focus:ring-blue-500">
                                Buttuh Target Selector (CSS/ID/Text)
                            </label>
                            <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 cursor-pointer">
                                <input type="checkbox" name="requires_value" value="true" class="rounded text-blue-600 focus:ring-blue-500">
                                Butuh Nilai Input / Value
                            </label>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Placeholder Selector (Opsional)</label>
                            <input type="text" name="placeholder_selector" placeholder="Misal: #btn-element" 
                                   class="w-full px-3 py-1.5 rounded-lg border text-xs">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Placeholder Value (Opsional)</label>
                            <input type="text" name="placeholder_value" placeholder="Misal: 500px" 
                                   class="w-full px-3 py-1.5 rounded-lg border text-xs">
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm transition-all shadow-sm shadow-blue-200">
                            Simpan Perintah
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Katalog Perintah Terdaftar di Database</h2>
                </div>

                <div id="command-table-container">
                    {% include 'partials/command_table.html' %}
                </div>
            </div>

        </div>
    </div>

    <div id="modal-container"></div>
</body>
</html>
