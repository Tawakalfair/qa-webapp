<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QA Automata</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden">
        <div class="p-8 sm:p-10">
            <!-- Logo & Heading -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center font-black text-3xl mx-auto shadow-lg shadow-blue-500/30 mb-4">
                    QA
                </div>
                <h1 class="font-bold text-2xl text-slate-900">QA Automata</h1>
                <p class="text-sm text-slate-500 mt-1">Silakan masuk untuk melanjutkan</p>
            </div>

            <!-- Error Banner -->
            {% if error %}
            <div class="bg-rose-50 text-rose-600 border border-rose-200 text-sm font-semibold rounded-xl p-3 mb-6 text-center">
                {{ error }}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form action="/login" method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Username</label>
                    <input type="text" name="username" required autofocus autocomplete="username"
                           class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" name="password" required autocomplete="current-password"
                           class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-sm font-medium">
                </div>
                
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-md mt-4 cursor-pointer">
                    Masuk ke Dashboard
                </button>
            </form>
        </div>
        <div class="bg-slate-50 py-4 text-center border-t border-slate-100">
            <p class="text-xs font-medium text-slate-400">&copy; 2026 Internal QA Team</p>
        </div>
    </div>
</body>
</html>
