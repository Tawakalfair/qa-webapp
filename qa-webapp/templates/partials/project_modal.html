<div id="project-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-6 relative animate-in fade-in zoom-in duration-150">
        <!-- Close Button -->
        <button type="button" 
                onclick="document.getElementById('project-modal').remove()" 
                class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 transition-colors">
            ✕
        </button>

        <h3 class="text-base font-bold text-slate-900 mb-1 flex items-center gap-2">
            <span>📁</span> Buat Proyek Baru
        </h3>
        <p class="text-xs text-slate-500 mb-4">Pengelompokan skenario berdasarkan aplikasi atau modul target.</p>

        <form action="/projects/new" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Proyek <span class="text-red-500">*</span></label>
                <input type="text" name="name" required placeholder="Misal: HRIS Portal / E-Commerce System" 
                       class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Deskripsi (Opsional)</label>
                <textarea name="description" rows="3" placeholder="Keterangan singkat cakupan proyek..." 
                          class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:outline-none focus:border-blue-500 text-sm"></textarea>
            </div>
            <div class="flex items-center justify-end gap-2 pt-2">
                <button type="button" 
                        onclick="document.getElementById('project-modal').remove()" 
                        class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
                    Batal
                </button>
                <button type="submit" 
                        class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md transition-colors">
                    Simpan Proyek
                </button>
            </div>
        </form>
    </div>
</div>
