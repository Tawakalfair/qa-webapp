{% if test_cases %}
    <div class="py-1.5 bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden z-[100]">
        {% for case in test_cases %}
        <!-- GUNAKAN onmousedown AGAR DIEKSEKUSI SEBELUM INPUT BLUR -->
        <div data-id="{{ case.id }}"
             data-name="{{ case.name|e }}"
             data-project="{{ (case.project.name if case.project else 'Default')|e }}"
             onmousedown="handleScenarioSelect(event, this)"
             class="px-3.5 py-2 text-xs hover:bg-blue-50 cursor-pointer flex items-center justify-between border-b border-slate-100 last:border-0 transition-colors gap-2">
            
            <!-- Nama Skenario & URL -->
            <div class="min-w-0 flex-1">
                <span class="font-bold text-slate-800 block truncate">{{ case.name }}</span>
                <span class="text-[10px] text-slate-400 block font-mono truncate">{{ case.base_url }}</span>
            </div>
            
            <!-- Badge Proyek -->
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 border border-slate-200 whitespace-nowrap flex-shrink-0">
                📁 {{ case.project.name if case.project else 'Default' }}
            </span>
        </div>
        {% endfor %}
    </div>
{% elif query|length >= 2 %}
    <div class="p-3 bg-white rounded-xl shadow-xl border border-slate-200 text-xs text-slate-400 italic text-center z-[100]">
        ❌ Skenario "{{ query }}" tidak ditemukan.
    </div>
{% endif %}
