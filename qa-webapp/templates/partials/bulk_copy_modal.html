<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-2xl p-6 relative max-h-[90vh] flex flex-col">
        
        <button type="button" 
                onclick="document.getElementById('modal-container').innerHTML = ''" 
                class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1 transition-colors cursor-pointer text-base font-bold">
            ✕
        </button>

        <div class="mb-4 border-b border-slate-200 pb-3">
            <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <span>📑</span> Batch Duplicate Scenarios
            </h2>
            <p class="text-xs text-slate-500 mt-1">Duplikasi beberapa skenario sekaligus dan sesuaikan nama baru serta proyek tujuannya.</p>
        </div>

        <form hx-post="/scenarios/bulk-copy" 
              hx-include="#filter-form" 
              class="flex flex-col flex-1 overflow-hidden">
            
            <div class="mb-4">
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Target Project</label>
                <select name="target_project_id" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold text-slate-800 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                    <option value="">Keep Original Project (Same as source)</option>
                    {% for proj in projects %}
                        <option value="{{ proj.id }}">{{ proj.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="border border-slate-200 rounded-xl overflow-hidden mb-4 flex-1 flex flex-col">
                <div class="bg-slate-100 px-4 py-2 text-[11px] font-bold text-slate-600 grid grid-cols-12 gap-2 border-b border-slate-200 uppercase tracking-wider">
                    <div class="col-span-5">Original Scenario</div>
                    <div class="col-span-7">New Scenario Name</div>
                </div>

                <div class="overflow-y-auto max-h-64 divide-y divide-slate-100 p-2 space-y-2">
                    {% for case in selected_cases %}
                    <div class="grid grid-cols-12 gap-2 items-center text-xs">
                        <div class="col-span-5 truncate text-slate-700 font-medium px-2" title="{{ case.name }}">
                            <input type="hidden" name="case_ids" value="{{ case.id }}">
                            <span class="text-slate-400 font-mono mr-1">#{{ case.id }}</span> {{ case.name }}
                        </div>

                        <div class="col-span-7">
                            <input type="text" 
                                   name="new_names" 
                                   value="[Copy] {{ case.name }}" 
                                   required 
                                   class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs text-slate-800 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button type="button" 
                        onclick="document.getElementById('modal-container').innerHTML = ''" 
                        class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors cursor-pointer">
                    Batal
                </button>
                <button type="submit" 
                        class="px-5 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md transition-colors cursor-pointer flex items-center gap-1.5">
                    <span>⚡</span> Process Batch Copy
                </button>
            </div>
        </form>

    </div>
</div>
