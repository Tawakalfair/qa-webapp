<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm transition-opacity">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-lg overflow-hidden animate-in fade-in zoom-in-95 duration-150">
        <!-- Header Modal -->
        <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                <span>✏️</span> Edit Skenario Tes #{{ case.id }}
            </h3>
            <button type="button" 
                    onclick="document.getElementById('modal-container').innerHTML=''"
                    class="text-slate-400 hover:text-slate-600 font-bold text-sm cursor-pointer">
                ✕
            </button>
        </div>

        <!-- Form Edit -->
        <form hx-post="/testcase/{{ case.id }}/edit"
              hx-target="#right-panel"
              hx-swap="innerHTML"
              class="p-6 space-y-4">
            
            <!-- Nama Skenario -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
                    Nama Skenario Tes <span class="text-rose-500">*</span>
                </label>
                <input type="text" name="name" value="{{ case.name }}" required
                       placeholder="Misal: Login Sukses Karyawan"
                       class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-semibold text-slate-800 focus:outline-none focus:border-blue-500">
            </div>

            <!-- Base URL -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
                    Target Base URL <span class="text-rose-500">*</span>
                </label>
                <input type="url" name="base_url" value="{{ case.base_url }}" required
                       placeholder="https://www.google.com"
                       class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-mono text-slate-700 focus:outline-none focus:border-blue-500">
            </div>

            <!-- Tipe Tes & Nomor Referensi (2 Kolom) -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
                        Tipe Tes
                    </label>
                    <select name="test_type" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700 bg-white focus:outline-none focus:border-blue-500">
                        <option value="Normal" {% if case.test_type == 'Normal' or not case.test_type %}selected{% endif %}>Normal</option>
                        <option value="Exception" {% if case.test_type == 'Exception' %}selected{% endif %}>Exception</option>
                        <option value="Boundary" {% if case.test_type == 'Boundary' %}selected{% endif %}>Boundary</option>
                        <option value="Regression" {% if case.test_type == 'Regression' %}selected{% endif %}>Regression</option>
                        <option value="Smoke" {% if case.test_type == 'Smoke' %}selected{% endif %}>Smoke</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">
                        No. Referensi (Opsional)
                    </label>
                    <input type="text" name="reference_number" value="{{ case.reference_number or '' }}"
                           placeholder="REQ-101 / Jira-202"
                           class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-mono text-slate-700 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- Tombol Aksi Modal -->
            <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button"
                        onclick="document.getElementById('modal-container').innerHTML=''"
                        class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:bg-slate-100 transition-colors cursor-pointer">
                    Batal
                </button>
                <button type="submit"
                        class="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-colors cursor-pointer">
                    Simpan Perubahan
                </button>
            </div>
        </form>
    </div>
</div>
